workspace: experiments/paper_compare
external_root: external_baselines

datasets:
  DIV2K:
    lr_dir: experiments/paper_compare/visual_inputs/DIV2K/LR_X4
    hr_dir: experiments/paper_compare/visual_inputs/DIV2K/HR
  RealSR:
    lr_dir: experiments/paper_compare/visual_inputs/RealSR/LR_X4
    hr_dir: experiments/paper_compare/visual_inputs/RealSR/HR
  DRealSR:
    lr_dir: experiments/paper_compare/visual_inputs/DRealSR/LR_X4
    hr_dir: experiments/paper_compare/visual_inputs/DRealSR/HR

methods:
  ResShift:
    status: runnable
    repo_url: https://github.com/zsyOAOA/ResShift.git
    repo_dir: ResShift
    commit: journal
    env_name: resshift
    entrypoint: inference_resshift.py
    input_arg: -i
    output_arg: -o
    extra_args:
      - --task
      - realsr
      - --scale
      - "4"
      - --version
      - v3
      - --chop_size
      - "256"
      - --chop_stride
      - "224"
      - --bs
      - "1"
    expected_output_patterns:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"

  DiffBIR:
    status: runnable
    repo_url: https://github.com/XPixelGroup/DiffBIR.git
    repo_dir: DiffBIR
    commit: main
    env_name: diffbir
    entrypoint: inference.py
    input_arg: --input
    output_arg: --output
    extra_args:
      - --task
      - sr
      - --upscale
      - "4"
      - --version
      - v2.1
      - --captioner
      - none
      - --cfg_scale
      - "1"
      - --noise_aug
      - "0"
      - --vae_encoder_tiled
      - --vae_encoder_tile_size
      - "256"
      - --vae_decoder_tiled
      - --vae_decoder_tile_size
      - "256"
      - --cldm_tiled
      - --cldm_tile_size
      - "512"
      - --cldm_tile_stride
      - "256"
      - --batch_size
      - "1"
      - --n_samples
      - "1"
      - --seed
      - "231"
      - --device
      - cuda
      - --precision
      - fp16
    notes: "Tuned on a 4-image DIV2K subset: cfg_scale=1 improved PSNR/LPIPS/DISTS over the previous cfg_scale=6 while keeping the same v2.1 no-caption setup."
    expected_output_patterns:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"

  SeeSR:
    status: runnable
    repo_url: https://github.com/cswry/SeeSR.git
    repo_dir: SeeSR
    commit: main
    env_name: seesr
    entrypoint: test_seesr.py
    input_arg: --image_path
    output_arg: --output_dir
    extra_args:
      - --pretrained_model_path
      - preset/models/stable-diffusion-2-base
      - --prompt
      - ""
      - --seesr_model_path
      - preset/models/seesr
      - --ram_ft_path
      - preset/models/DAPE.pth
      - --start_point
      - lr
      - --num_inference_steps
      - "50"
      - --guidance_scale
      - "5.5"
      - --process_size
      - "512"
    expected_output_patterns:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"

  SeeSR_g3p5_wavelet:
    status: runnable
    repo_url: https://github.com/cswry/SeeSR.git
    repo_dir: SeeSR
    commit: main
    env_name: seesr
    entrypoint: test_seesr.py
    input_arg: --image_path
    output_arg: --output_dir
    extra_args:
      - --pretrained_model_path
      - preset/models/stable-diffusion-2-base
      - --prompt
      - ""
      - --seesr_model_path
      - preset/models/seesr
      - --ram_ft_path
      - preset/models/DAPE.pth
      - --start_point
      - lr
      - --num_inference_steps
      - "50"
      - --guidance_scale
      - "3.5"
      - --process_size
      - "512"
      - --align_method
      - wavelet
      - --seed
      - "42"
    notes: "Visual-check variant: lower guidance than the official 5.5 setting and wavelet color alignment to reduce over-generated/unstable appearance."
    expected_output_patterns:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"

  SeeSR_g1p5_s40_wavelet:
    status: runnable
    repo_url: https://github.com/cswry/SeeSR.git
    repo_dir: SeeSR
    commit: main
    env_name: seesr
    entrypoint: test_seesr.py
    input_arg: --image_path
    output_arg: --output_dir
    extra_args:
      - --pretrained_model_path
      - preset/models/stable-diffusion-2-base
      - --prompt
      - ""
      - --seesr_model_path
      - preset/models/seesr
      - --ram_ft_path
      - preset/models/DAPE.pth
      - --start_point
      - lr
      - --num_inference_steps
      - "40"
      - --guidance_scale
      - "1.5"
      - --process_size
      - "512"
      - --align_method
      - wavelet
      - --seed
      - "42"
    notes: "Visual-check variant requested by user: lower guidance=1.5 and 40 steps to reduce hallucination."
    expected_output_patterns:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"

  PiSA-SR:
    status: runnable
    repo_url: https://github.com/csslc/PiSA-SR.git
    repo_dir: PiSA-SR
    commit: main
    env_name: pisasr
    entrypoint: test_pisasr.py
    input_arg: --input_image
    output_arg: --output_dir
    extra_args:
      - --pretrained_model_path
      - preset/models/stable-diffusion-2-1-base
      - --pretrained_path
      - preset/models/pisa_sr.pkl
      - --process_size
      - "512"
      - --upscale
      - "4"
      - --default
    expected_output_patterns:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"

  StableSR:
    status: public_needs_command
    repo_url: https://github.com/IceClear/StableSR.git
    repo_dir: StableSR
    commit: main
    env_name: stablesr
    pythonpath_repo: true
    pythonpath_extra:
      - src/taming-transformers
    entrypoint: scripts/sr_val_ddim_text_T_negativeprompt_canvas_tile.py
    input_arg: --init-img
    output_arg: --outdir
    extra_args:
      - --config
      - configs/stableSRNew/v2-finetune_text_T_768v.yaml
      - --ckpt
      - stablesr_768v_000139.ckpt
      - --vqgan_ckpt
      - vqgan_cfw_00011.ckpt
      - --ddim_steps
      - "20"
      - --dec_w
      - "0.0"
      - --colorfix_type
      - wavelet
      - --scale
      - "7.0"
      - --use_negative_prompt
      - --upscale
      - "4"
      - --seed
      - "42"
      - --n_samples
      - "1"
      - --input_size
      - "768"
      - --vqgantile_size
      - "768"
      - --vqgantile_stride
      - "720"
      - --tile_overlap
      - "48"
      - --ddim_eta
      - "1.0"
    notes: "Official 768v tiled DDIM command from README. Uses PYTHONPATH=repo because editable install is fragile with modern setuptools."
    expected_output_patterns:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"

  SinSR:
    status: runnable
    repo_url: https://github.com/wyf0912/SinSR.git
    repo_dir: SinSR
    commit: main
    env_name: resshift
    entrypoint: inference.py
    input_arg: -i
    output_arg: -o
    extra_args:
      - --scale
      - "4"
      - --one_step
      - --task
      - SinSR
      - --chop_size
      - "256"
      - --seed
      - "12345"
    notes: "Official fast testing command with README low-memory chop_size=256 for large DIV2K images. Checkpoints auto-download from the SinSR/ResShift GitHub releases into external_baselines/SinSR/weights."
    expected_output_patterns:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"

  FluxSR:
    status: public_needs_command
    repo_url: https://github.com/JianzeLi-114/FluxSR.git
    repo_dir: FluxSR
    commit: master
    env_name: fluxsr
    notes: "Official repo is public. Fill exact inference command after local setup and weight download."

  PASD:
    status: public_needs_command
    repo_url: https://github.com/yangxy/PASD.git
    repo_dir: PASD
    commit: main
    env_name: IR
    entrypoint: test_pasd.py
    input_arg: --image_path
    output_arg: --output_dir
    extra_args:
      - --pasd_model_path
      - runs/pasd/checkpoint-100000
      - --pretrained_model_path
      - ../weights/hf/stable-diffusion-v1-5-official
      - --high_level_info
      - none
      - --upscale
      - "4"
      - --seed
      - "123"
      - --decoder_tiled_size
      - "224"
      - --encoder_tiled_size
      - "1024"
      - --latent_tiled_size
      - "320"
      - --latent_tiled_overlap
      - "8"
    notes: "Public repo and pretrained models are available. Uses fixed prompt/no caption and conservative x4 tiling to avoid OOM on large images."
    expected_output_patterns:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"

  OSEDiff:
    status: public_needs_command
    repo_url: https://github.com/cswry/OSEDiff.git
    repo_dir: OSEDiff
    commit: main
    env_name: pisasr
    entrypoint: test_osediff.py
    input_arg: -i
    output_arg: -o
    extra_args:
      - --osediff_path
      - preset/models/osediff.pkl
      - --pretrained_model_name_or_path
      - preset/models/stable-diffusion-2-1-base
      - --ram_ft_path
      - preset/models/DAPE.pth
      - --ram_path
      - preset/models/ram_swin_large_14m.pth
      - --process_size
      - "512"
      - --upscale
      - "4"
    notes: "Public repo, model links, and benchmark outputs are available. Fill model files under preset/models."
    expected_output_patterns:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"

  FlowSR:
    status: pending_public_code
    repo_url: null
    repo_dir: FlowSR
    commit: null
    env_name: flowsr
    notes: "Skip visual comparison until reliable official code/checkpoint is available."

  GuideSR:
    status: pending_public_code
    repo_url: null
    repo_dir: GuideSR
    commit: null
    env_name: guidesr
    notes: "Skip visual comparison until reliable official code/checkpoint is available."

  PGSR:
    status: local
    repo_url: null
    repo_dir: .
    commit: local
    env_name: null
    notes: "Run with scripts/paper_compare/run_pgsr.py instead of run_baseline.py."
